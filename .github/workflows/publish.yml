name: publish

# Runs when a release tag is pushed: `<package name>@<version>`, such as `@sureq/core@1.0.2` or
# `@sureq/store-test@1.0.1`. Each package is versioned and published on its own; the tag names the one
# package this run publishes. Nothing else starts it.
on:
  push:
    tags:
      - '@sureq/*@*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The environment's required reviewer approves the release before this job runs.
    environment: npm-publish
    steps:
      # full history, so the tag can be checked against main
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # the tag must name a published workspace package and its current version, and point at a commit on main
      - name: Check the tag names a package at its version, on main
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG%@*}"
          version="${TAG##*@}"
          dir=$(node -e "
            const fs = require('fs');
            const hit = fs.readdirSync('packages').find((d) => {
              const f = 'packages/' + d + '/package.json';
              return fs.existsSync(f) && JSON.parse(fs.readFileSync(f, 'utf8')).name === process.argv[1];
            });
            if (hit) console.log('packages/' + hit);
          " "$name")
          if [ -z "$dir" ]; then echo "tag $TAG names no package under packages/"; exit 1; fi
          if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then echo "$name is private"; exit 1; fi
          actual=$(node -p "require('./$dir/package.json').version")
          if [ "$version" != "$actual" ]; then echo "tag $TAG does not match $name version $actual"; exit 1; fi
          if ! git merge-base --is-ancestor HEAD origin/main; then echo "tag $TAG does not point at a commit on main"; exit 1; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          case "$version" in
            # a prerelease version (one with a hyphen) is published under `next`, so it never takes the `latest` tag
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      # Trusted publishing (no token) needs npm 11.5.1 or newer; the Node 22 image ships an older npm.
      - run: npm install -g npm@latest
      - run: npm ci
      # every package is built and checked, so a release never ships against a broken workspace
      - run: npm run build
      - run: npm run test:dist
      - run: npm run check:pkg
      - run: npm run check:licenses
      # Publishes through the trusted publisher set up on npmjs.com for this package: no token is read here.
      - run: npm publish --provenance --access public --tag ${{ steps.pkg.outputs.dist_tag }} --registry=https://registry.npmjs.org/ -w ${{ steps.pkg.outputs.name }}
