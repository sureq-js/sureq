name: ci

# Runs once per pull request update. Not on branch pushes (the PR already runs it), not on merges to main
# (the PR was green and up to date with main before the merge), and not on release tags (already tested).
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # coverage runs the tests of the packages with thresholds; the rest run their tests directly
      - run: npm run coverage
      - run: npm test -w store-template
      - run: npm run test:dist
      - run: npm run check:pkg
      - run: npm run check:licenses
      - run: npm run api:check

  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:conformance

  stress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:stress

  types:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        typescript: ['5.0', '7.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save typescript@${{ matrix.typescript }}
      - run: npm run test:types
      - run: npm run typecheck
      # the skill samples compile with the TypeScript this job installed
      - run: npm exec -w @sureq/core -- vitest run tests/skill/samples.test.ts
